<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Gutscheinseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#f1efff;--card:#fff;--tx:#17143a;--mut:#6a6788;--bd:#dcd8f5;--ac:#6c4dff;--ac2:#ff6fae;--on:#fff;--ok:#12805c}
@media(prefers-color-scheme:dark){:root{--bg:#100e24;--card:#1b1838;--tx:#f2f0ff;--mut:#a29fc4;--bd:#2f2b57;--ok:#4cd6a0}}
[data-t=geburtstag]{--ac:#f26b1d;--ac2:#ffc02e}
[data-t=weihnachten]{--ac:#c8283c;--ac2:#1f9a58}
[data-t=hochzeit]{--ac:#b8749f;--ac2:#f0c9dc}
[data-t=sonstiges]{--ac:#6c4dff;--ac2:#ff6fae}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Figtree,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}
a{color:var(--ac)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:.65rem 1.1rem;background:var(--ac);color:var(--on);font-weight:700}
button.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
button:disabled{background:var(--bd);color:var(--mut);cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
input,select{width:100%;padding:.65rem .8rem;border-radius:10px;border:1.5px solid var(--bd);background:var(--card)}
label{display:block;font-weight:700;font-size:.9rem;margin:.8rem 0 .25rem}
.wrap{max-width:960px;margin:0 auto;padding:1rem 1rem 4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0 1rem}
.top b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.top a{text-decoration:none;color:var(--tx)}
.hero{padding:2.5rem 0 1.5rem}
.hero h1{font-size:clamp(2.4rem,9vw,4.6rem);font-weight:800;max-width:11em}
.hero p{max-width:34em;color:var(--mut);font-size:1.1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.occ{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.occ label{margin:0;border:2px solid var(--bd);border-radius:14px;padding:.8rem;text-align:center;cursor:pointer;background:var(--card);font-size:1rem}
.occ input{display:none}
.occ input:checked+span{color:var(--ac)}
.occ label:has(input:checked){border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.occ em{display:block;font-size:1.8rem;font-style:normal}
.lh{border-radius:20px;padding:1.6rem 1.4rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;margin:.5rem 0 1rem}
.lh h1{font-size:clamp(1.8rem,6vw,3rem)}
.lh p{margin:.4rem 0 0;opacity:.92}
.lh button{background:#fff;color:#17143a}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.bar input{flex:1 1 160px;width:auto}.bar select{width:auto}
.chip{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);padding:.45rem .8rem;border-radius:99px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tk{position:relative;background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
 -webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
 mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
 filter:drop-shadow(0 6px 14px rgba(20,10,60,.12))}
.tk .im{aspect-ratio:16/10;background:linear-gradient(135deg,var(--ac),var(--ac2)) center/cover;display:grid;place-items:center;font-size:2.5rem}
.tk .bd{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.45rem;flex:1;border-top:2px dashed var(--bd);margin-top:-1px}
.tk h3{font-size:1.15rem}
.pr{font-weight:800;font-size:1.25rem}
.st{color:var(--ac);letter-spacing:.1em}
.mut{color:var(--mut);font-size:.9rem}
.pg{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tk.done .im,.tk.done .bd>*:not(.flag){opacity:.45}
.tk.done .im{filter:grayscale(1)}
.flag{align-self:flex-start;background:var(--ok);color:#fff;font-weight:700;border-radius:8px;padding:.15rem .6rem;font-size:.85rem}
.x{position:absolute;top:.5rem;right:.6rem;background:#0008;color:#fff;border-radius:99px;padding:.2rem .6rem;z-index:2}
dialog{border:0;border-radius:20px;padding:1.4rem;max-width:min(92vw,420px);background:var(--card);color:var(--tx);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0a0620aa}
.warn{background:color-mix(in srgb,var(--ac2) 22%,transparent);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.note{background:var(--card);border:1.5px dashed var(--ac);border-radius:14px;padding:1rem;margin:1rem 0}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,OAuthProvider,signInWithPopup,signOut,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,collection,addDoc,deleteDoc,onSnapshot,getDocs,query,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== HIER DEINE FIREBASE-DATEN EINTRAGEN ====== */
const firebaseConfig={
  apiKey:"AIzaSyCvH6WvR2KQR6IHcYBHCHECDEVvOyfSXMM",
  authDomain:"wunschliste-4e66d.firebaseapp.com",
  projectId:"wunschliste-4e66d",
  storageBucket:"wunschliste-4e66d.firebasestorage.app",
  messagingSenderId:"443503462360",
  appId:"1:443503462360:web:52276890a5c1efb88554ad"
};
/* ================================================= */

const configured=!firebaseConfig.apiKey.startsWith("DEIN");
let auth,db;
if(configured){const a=initializeApp(firebaseConfig);auth=getAuth(a);db=getFirestore(a)}

const OCC={geburtstag:["🎂","Geburtstag"],weihnachten:["🎄","Weihnachten"],hochzeit:["💍","Hochzeit"],sonstiges:["🎁","Sonstiges"]};
const eur=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?u:"";
const $=s=>document.querySelector(s);
const app=$("#app"),dlg=$("#dlg");
let user=null,unsubs=[],F={sort:"score",type:"all",free:false,q:""};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}
function clear(){unsubs.forEach(u=>u());unsubs=[]}
function top(){return`<div class="top"><a href="#/"><b>🎟️ Die Gutscheinseite</b></a><div class="row">${user?`<span class="mut">${esc(user.displayName||user.email||"")}</span><button class="ghost" data-a="out">Abmelden</button>`:`<button class="ghost" data-a="in">Anmelden</button>`}</div></div>`}
function setup(){return configured?"":`<div class="note"><b>Firebase fehlt noch.</b> Trage oben in der index.html deine Firebase-Daten ein, dann läuft alles.</div>`}

async function route(){
  clear();
  const h=location.hash.replace(/^#\/?/,"").split("/");
  document.body.removeAttribute("data-t");
  if(h[0]==="l"&&h[1])return listView(h[1]);
  if(h[0]==="neu")return newView();
  return home();
}

async function home(){
  app.innerHTML=top()+setup()+(user?`<div class="row" style="justify-content:space-between;margin:1rem 0"><h2>Deine Listen</h2><button data-a="new">Neue Liste</button></div><div class="grid" id="mine"><p class="mut">Lädt …</p></div>`:
  `<div class="hero"><h1>Wünsche sammeln. Gemeinsam schenken.</h1><p>Lege eine Liste an, wähle den Anlass, füge Artikel und Gutscheine hinzu und teile den Link. Wer schenkt, braucht kein Konto.</p><button data-a="in">Anmelden und starten</button></div>`);
  if(!user||!configured)return;
  const s=await getDocs(query(collection(db,"lists"),where("owner","==",user.uid)));
  const el=$("#mine");if(!el)return;
  el.innerHTML=s.empty?`<div class="empty">Noch keine Liste. Leg gleich deine erste an.</div>`:
   s.docs.map(d=>{const l=d.data(),o=OCC[l.occ]||OCC.sonstiges;return`<a href="#/l/${d.id}" data-t="${esc(l.occ)}" style="text-decoration:none;color:#fff"><div class="lh" style="margin:0"><div style="font-size:2rem">${o[0]}</div><h2>${esc(l.title)}</h2><p>${o[1]}</p></div></a>`}).join("");
}

function newView(){
  if(!user){location.hash="#/";return}
  app.innerHTML=top()+`<h2>Neue Liste</h2><form id="nf"><label for="t">Name der Liste</label><input id="t" required maxlength="60" placeholder="z. B. Mein 30. Geburtstag"><label>Anlass</label><div class="occ">${Object.entries(OCC).map(([k,v],i)=>`<label><input type="radio" name="o" value="${k}" ${i?"":"checked"}><em>${v[0]}</em>${v[1]}</label>`).join("")}</div><p><button type="submit">Liste erstellen</button></p></form>`;
  $("#nf").onsubmit=async e=>{e.preventDefault();
    const r=await addDoc(collection(db,"lists"),{title:$("#t").value.trim(),occ:new FormData(e.target).get("o"),owner:user.uid,created:serverTimestamp()});
    location.hash="#/l/"+r.id};
}

function listView(id){
  let L=null,items=[];
  app.innerHTML=top()+setup()+`<p class="mut">Lädt …</p>`;
  if(!configured)return;
  const paint=()=>{
    if(!L)return;
    const own=user&&L.owner===user.uid,o=OCC[L.occ]||OCC.sonstiges;
    document.body.setAttribute("data-t",L.occ);
    let v=items.filter(i=>(F.type==="all"||i.type===F.type)&&(!F.free||!isDone(i))&&i.name.toLowerCase().includes(F.q.toLowerCase()));
    const S={score:(a,b)=>b.score-a.score,pa:(a,b)=>val(a)-val(b),pd:(a,b)=>val(b)-val(a),new:(a,b)=>(b.created?.seconds||0)-(a.created?.seconds||0)};
    v.sort(S[F.sort]);
    const open=items.filter(i=>i.type==="item"&&!isDone(i)).reduce((s,i)=>s+i.price*(i.qty-i.bought),0);
    const gOpen=items.filter(i=>i.type==="gift").reduce((s,i)=>s+Math.max(0,i.goal-i.collected),0);
    const keep=document.activeElement?.id==="q";
    app.innerHTML=top()+`<div class="lh"><div style="font-size:2rem">${o[0]}</div><h1>${esc(L.title)}</h1><p>Noch offen: ${eur(open+gOpen)}</p><div class="row" style="margin-top:.9rem"><button data-a="share">Link teilen</button>${own?`<button data-a="add">Eintrag hinzufügen</button>`:""}</div></div>
    <div class="bar"><input id="q" type="search" placeholder="Suchen …" value="${esc(F.q)}" aria-label="Suchen">
    <select id="s" aria-label="Sortieren"><option value="score">Wichtigste zuerst</option><option value="pa">Preis aufsteigend</option><option value="pd">Preis absteigend</option><option value="new">Neueste zuerst</option></select>
    ${[["all","Alle"],["item","Artikel"],["gift","Gutscheine"]].map(([k,n])=>`<button class="chip ${F.type===k?"on":""}" data-a="type" data-v="${k}">${n}</button>`).join("")}
    <button class="chip ${F.free?"on":""}" data-a="free">Nur Verfügbare</button></div>
    ${v.length?`<div class="grid">${v.map(i=>card(i,own)).join("")}</div>`:`<div class="empty">${items.length?"Nichts gefunden. Ändere die Filter.":own?"Noch leer. Füge deinen ersten Wunsch hinzu.":"Hier steht noch nichts."}</div>`}`;
    $("#s").value=F.sort;
    if(keep){const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length)}
    app._items=items;app._own=own;
  };
  unsubs.push(onSnapshot(doc(db,"lists",id),s=>{if(!s.exists()){app.innerHTML=top()+`<div class="empty">Diese Liste gibt es nicht.</div>`;return}L={id,...s.data()};paint()}));
  unsubs.push(onSnapshot(collection(db,"lists",id,"items"),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));paint()}));
  app._lid=id;app._paint=paint;
}
const isDone=i=>i.type==="gift"?i.collected>=i.goal:i.bought>=i.qty;
const val=i=>i.type==="gift"?i.goal:i.price;

function card(i,own){
  const gift=i.type==="gift",done=isDone(i),pct=gift?Math.min(100,i.collected/i.goal*100):(i.bought/i.qty*100);
  const img=url(i.img);
  return`<article class="tk ${done?"done":""}">${own?`<button class="x" data-a="del" data-id="${i.id}" aria-label="Löschen">✕</button>`:""}
  <div class="im" ${img?`style="background-image:url('${esc(img)}')"`:""}>${img?"":(gift?"🎟️":"🎁")}</div>
  <div class="bd">${done?`<span class="flag">${gift?"Ausverkauft":"Schon gekauft"}</span>`:""}
  <h3>${esc(i.name)}</h3><span class="st" aria-label="Wichtigkeit ${i.score} von 5">${"★".repeat(i.score)}${"☆".repeat(5-i.score)}</span>
  <div class="pr">${gift?eur(i.goal):eur(i.price)}</div>
  ${gift||i.qty>1?`<div class="pg"><i style="width:${pct}%"></i></div><div class="mut">${gift?`${eur(i.collected)} von ${eur(i.goal)}`:`${i.bought} von ${i.qty} gekauft`}</div>`:""}
  ${url(i.link)?`<a class="mut" href="${esc(url(i.link))}" target="_blank" rel="noopener">Zum Shop ↗</a>`:""}
  <div style="margin-top:auto;padding-top:.3rem"><button data-a="buy" data-id="${i.id}" style="width:100%" ${done?"disabled":""}>${done?"Nicht mehr verfügbar":gift?"Beitragen":"Kaufen"}</button></div></div></article>`;
}

function askBuy(i){
  const gift=i.type==="gift",rest=gift?i.goal-i.collected:0;
  dlg.innerHTML=`<h2>${gift?"Wie viel schenkst du?":"Wirklich kaufen?"}</h2><p><b>${esc(i.name)}</b></p>
  ${gift?`<label for="amt">Betrag in Euro (max. ${eur(rest)})</label><input id="amt" type="number" min="1" max="${rest}" step="1" value="${Math.min(rest,20)}">`:""}
  <div class="warn">Achtung: ${gift?"Der Betrag":"Der Kauf"} lässt sich danach nicht mehr rückgängig machen.</div>
  <div class="row" style="justify-content:flex-end"><button class="ghost" data-a="close">Abbrechen</button><button id="go">${gift?"Verbindlich beitragen":"Verbindlich kaufen"}</button></div>`;
  dlg.showModal();
  $("#go").onclick=async()=>{
    const amt=gift?Math.round(Number($("#amt").value)):1;
    if(!(amt>=1)||(gift&&amt>rest)){toast("Bitte einen gültigen Betrag eingeben.");return}
    try{await runTransaction(db,async t=>{
      const r=doc(db,"lists",app._lid,"items",i.id),d=(await t.get(r)).data();
      if(d.type==="gift"){if(d.collected+amt>d.goal)throw 0;t.update(r,{collected:d.collected+amt})}
      else{if(d.bought>=d.qty)throw 0;t.update(r,{bought:d.bought+1})}});
      dlg.close();toast("Gekauft. Danke!")}
    catch{dlg.close();toast("Das war leider schon weg oder zu viel.")}
  };
}

function authMsg(c){return({"auth/invalid-credential":"E-Mail oder Passwort stimmt nicht.","auth/email-already-in-use":"Diese E-Mail hat schon ein Konto.","auth/weak-password":"Das Passwort ist zu kurz (mindestens 6 Zeichen).","auth/invalid-email":"Die E-Mail-Adresse ist ungültig.","auth/operation-not-allowed":"Diese Anmeldung ist in Firebase noch nicht aktiviert.","auth/unauthorized-domain":"Diese Domain ist in Firebase nicht freigegeben."})[c]||"Anmeldung nicht möglich."}

async function provLogin(p){
  try{await signInWithPopup(auth,p==="apple"?new OAuthProvider("apple.com"):new GoogleAuthProvider());dlg.close()}
  catch(x){if(x.code!=="auth/popup-closed-by-user")toast(authMsg(x.code))}
}

function loginDlg(){
  if(!configured){toast("Firebase ist noch nicht eingerichtet.");return}
  dlg.innerHTML=`<h2>Anmelden</h2>
  <div class="row" style="flex-direction:column;align-items:stretch;margin-top:.8rem"><button data-a="prov" data-v="google">Mit Google fortfahren</button><button data-a="prov" data-v="apple" style="background:#000;color:#fff">Mit Apple fortfahren</button></div>
  <p class="mut" style="text-align:center;margin:.9rem 0 0">oder mit E-Mail</p>
  <form id="lf"><label for="em">E-Mail</label><input id="em" type="email" required autocomplete="email">
  <label for="pw">Passwort</label><input id="pw" type="password" required minlength="6" autocomplete="current-password">
  <div class="row" style="margin-top:1rem"><button type="submit" data-m="in">Anmelden</button><button type="submit" class="ghost" data-m="up">Konto erstellen</button></div></form>
  <div class="row" style="margin-top:.8rem"><button type="button" class="ghost" data-a="reset">Passwort vergessen?</button><button type="button" class="ghost" data-a="close">Abbrechen</button></div>`;
  dlg.showModal();
  $("#lf").onsubmit=async e=>{e.preventDefault();
    const em=$("#em").value.trim(),pw=$("#pw").value;
    try{if(e.submitter?.dataset.m==="up")await createUserWithEmailAndPassword(auth,em,pw);else await signInWithEmailAndPassword(auth,em,pw);dlg.close()}
    catch(x){toast(authMsg(x.code))}};
}

function addDlg(){
  dlg.innerHTML=`<h2>Eintrag hinzufügen</h2><form id="af"><label for="ty">Art</label><select id="ty"><option value="item">Artikel</option><option value="gift">Gutschein</option></select>
  <label for="nm">Name</label><input id="nm" required maxlength="80">
  <label for="lk">Link (optional)</label><input id="lk" type="url" placeholder="https://…">
  <label for="im">Bild-Link (optional)</label><input id="im" type="url" placeholder="https://…">
  <div id="f1"><label for="pr">Preis in Euro</label><input id="pr" type="number" min="0" step="0.01" value="0">
  <label for="qt">Wie oft darf er gekauft werden?</label><input id="qt" type="number" min="1" max="99" value="1"></div>
  <div id="f2" hidden><label for="gl">Gesamtbetrag, den du haben möchtest (Euro)</label><input id="gl" type="number" min="1" step="1" value="50"></div>
  <label for="sc">Wichtigkeit (1 bis 5)</label><input id="sc" type="range" min="1" max="5" value="3">
  <div class="row" style="justify-content:flex-end;margin-top:1rem"><button type="button" class="ghost" data-a="close">Abbrechen</button><button type="submit">Speichern</button></div></form>`;
  dlg.showModal();
  $("#ty").onchange=e=>{$("#f1").hidden=e.target.value==="gift";$("#f2").hidden=e.target.value!=="gift"};
  $("#af").onsubmit=async e=>{e.preventDefault();const g=$("#ty").value==="gift";
    await addDoc(collection(db,"lists",app._lid,"items"),{type:g?"gift":"item",name:$("#nm").value.trim(),link:$("#lk").value,img:$("#im").value,
      price:g?0:Number($("#pr").value)||0,qty:g?1:Math.max(1,Math.floor($("#qt").value)||1),bought:0,
      goal:g?Math.max(1,Math.round($("#gl").value)):0,collected:0,score:Number($("#sc").value),created:serverTimestamp()});
    dlg.close();toast("Eintrag gespeichert.")};
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,it=app._items?.find(x=>x.id===b.dataset.id);
  if(a==="in")loginDlg();
  else if(a==="prov")provLogin(b.dataset.v);
  else if(a==="reset"){const em=$("#em")?.value.trim();if(!em){toast("Gib oben deine E-Mail ein.");return}try{await sendPasswordResetEmail(auth,em)}catch{}toast("Wenn es ein Konto gibt, ist eine E-Mail unterwegs.")}
  else if(a==="out"){await signOut(auth);location.hash="#/"}
  else if(a==="new")location.hash="#/neu";
  else if(a==="close")dlg.close();
  else if(a==="add")addDlg();
  else if(a==="buy"&&it)askBuy(it);
  else if(a==="del"&&it&&confirm("Diesen Eintrag löschen?"))await deleteDoc(doc(db,"lists",app._lid,"items",it.id));
  else if(a==="share"){try{await navigator.clipboard.writeText(location.href);toast("Link kopiert.")}catch{prompt("Link kopieren:",location.href)}}
  else if(a==="type"){F.type=b.dataset.v;app._paint()}
  else if(a==="free"){F.free=!F.free;app._paint()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value;app._paint()}});
document.addEventListener("change",e=>{if(e.target.id==="s"){F.sort=e.target.value;app._paint()}});
window.addEventListener("hashchange",route);

if(configured)onAuthStateChanged(auth,u=>{user=u;route()});else route();
</script>
